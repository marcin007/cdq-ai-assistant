name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: sh scripts/test-bootstrap-weather-mcp.sh
      - run: sh scripts/test-local-operations.sh
      - run: node --test assistant-app/src/test/frontend/chat-page.test.mjs
      - run: node --test assistant-app/src/test/frontend/knowledge-panel.test.mjs
      - run: node --test scripts/evaluate.test.mjs
      - run: node --test scripts/reliability.test.mjs
      - run: node --test showcase/tests/showcase.test.mjs
      - run: node --test scripts/assert-pgvector-it-ran.test.mjs
      - run: node --test scripts/check-knowledge-freshness.test.mjs
      - run: node scripts/check-knowledge-freshness.mjs --max-age-days 45
      - run: ./mvnw --batch-mode verify
      - run: node scripts/assert-pgvector-it-ran.mjs
